name: FindMyHeadphones
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
  # Bump to match your installed Xcode version if needed (e.g., '16.0')
  xcodeVersion: '15.1'
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    # Signing lives here rather than in Xcode's UI: the .xcodeproj is
    # regenerated from this file, which would wipe anything set by hand.
    #
    # SEDO STUDIO LIMITED — the paid organization membership. Not the free
    # Personal Team Xcode makes for on-device testing: that one cannot publish
    # or sell in-app purchases, and it never appears in the developer portal.
    DEVELOPMENT_TEAM: 2Z5LQ3U8QM
    CODE_SIGN_STYLE: Automatic
targets:
  FindMyHeadphones:
    type: application
    platform: iOS
    dependencies:
      - package: TelemetryDeck
        product: TelemetryClient
      - package: RevenueCat
        product: RevenueCat
    sources:
      - path: Config
        excludes:
          - Secrets.sample.swift
      - path: Core
      - path: Modules
      - path: Resources
        excludes:
          - Info.plist # handled via info block below
    info:
      path: Resources/Info.plist
      properties:
        # Take the version and build number from the build settings below,
        # rather than letting XcodeGen write its defaults here. Without these
        # two lines CFBundleVersion is pinned at 1 and every archive uploads
        # as the same build, whatever CURRENT_PROJECT_VERSION says.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Core feature: scanning for the user's headphones (Modules/Finder).
        NSBluetoothAlwaysUsageDescription: >-
          We use Bluetooth to look for your headphones and show how strong their
          signal is. Nothing leaves your iPhone.
        # Lets iOS wake the app for connect/disconnect events, which is what
        # powers "left behind" alerts (Modules/LeftBehind).
        UIBackgroundModes:
          - bluetooth-central
        # The home-screen name. Without this iOS falls back to the product
        # name and shows "FindMyHeadphones" run together. Matches the App
        # Store name; iOS truncates the tail on the home screen itself.
        CFBundleDisplayName: Headphone Finder
        # The app's only network traffic is RevenueCat's and TelemetryDeck's
        # HTTPS, which is exempt. Without this, App Store Connect asks the
        # export-compliance question on every upload and holds the build
        # until it is answered.
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sedostudio.findmyheadphones
        # iPhone only. Including iPad would oblige the app to support all four
        # orientations for multitasking, and this is a portrait app you walk
        # around the house with — the radar assumes one hand and one thumb.
        TARGETED_DEVICE_FAMILY: 1
        # Build number. Must increase for every upload to App Store Connect;
        # a number already used is rejected. MARKETING_VERSION is what
        # customers see and only changes for a real release.
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0
    scheme:
      testTargets:
        - name: FindMyHeadphonesTests

  FindMyHeadphonesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FindMyHeadphones

packages:
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 1.5.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0

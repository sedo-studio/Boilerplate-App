name: FindMyHeadphones
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
  # Bump to match your installed Xcode version if needed (e.g., '16.0')
  xcodeVersion: '15.1'
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    # Signing lives here rather than in Xcode's UI: the .xcodeproj is
    # regenerated from this file, which would wipe anything set by hand.
    DEVELOPMENT_TEAM: RHHZ3ABR92
    CODE_SIGN_STYLE: Automatic
targets:
  FindMyHeadphones:
    type: application
    platform: iOS
    dependencies:
      - package: TelemetryDeck
        product: TelemetryClient
      - package: RevenueCat
        product: RevenueCat
    sources:
      - path: Config
        excludes:
          - Secrets.sample.swift
      - path: Core
      - path: Modules
      - path: Resources
        excludes:
          - Info.plist # handled via info block below
    info:
      path: Resources/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Core feature: scanning for the user's headphones (Modules/Finder).
        NSBluetoothAlwaysUsageDescription: >-
          We use Bluetooth to look for your headphones and show how strong their
          signal is. Nothing leaves your iPhone.
        # Lets iOS wake the app for connect/disconnect events, which is what
        # powers "left behind" alerts (Modules/LeftBehind).
        UIBackgroundModes:
          - bluetooth-central
        CFBundleLocalizations:
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francisgane.findmyheadphones
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    scheme:
      testTargets:
        - name: FindMyHeadphonesTests

  FindMyHeadphonesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FindMyHeadphones

packages:
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 1.5.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
